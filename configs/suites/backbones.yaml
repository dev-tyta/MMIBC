# Backbone bake-off with the fusion held fixed (xattn), on VinDr-Mammo (BI-RADS labels); backbones_cmmd.yaml is the same on CMMD (biopsy labels).
# DINOv3 repositories are GATED: accept the licence on Hugging Face and provide HF_TOKEN. Until then those rows are SKIPPED (the other rows
# run normally); after you add the token, call the same command again: finished rows are kept and only the skipped ones are trained.
# A row that fails for another reason is recorded as failed instead of stopping the suite.
config: vindr_multiview.yaml
reference: dinov2_base
continue_on_error: true
runs:
  - {name: dinov2_base,      set: [model.backbone=dinov2_base]}
  - {name: dinov2reg_base,   set: [model.backbone=dinov2reg_base]}
  - {name: dinov3_vitb16,    set: [model.backbone=dinov3_vitb16]}
  - {name: dinov3_vitl16,    set: [model.backbone=dinov3_vitl16, training.batch_size=16]}
  - {name: tv_convnext_base, set: [model.backbone=tv_convnext_base, training.lr_backbone=5.0e-5]}
  - {name: tv_efficientnet_b5, set: [model.backbone=tv_efficientnet_b5, training.lr_backbone=5.0e-5]}

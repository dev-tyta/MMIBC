# Base configuration. Experiment configs override only what they change.
# Override anything from the command line:  --set training.epochs=3 model.fusion=xattn
seed: 42
run_name: ${task.kind}_${model.fusion}_s${seed}

paths:
  root: null            # null -> $MMIBC_ROOT, else /content/drive/MyDrive/MMIBC on Colab, else ./workspace
  local: null           # fast scratch disk for staged images (Colab: /content/mmibc_local)
  raw_on_drive: true    # true: raw downloads are saved on Drive (survive runtime resets; mind your Drive quota). false: local disk only

data:
  split_seed: null      # seed of the train/val(/test) partition. null -> `seed`. Fix it (e.g. 42) to compare several training seeds on identical splits
  store_long_side: 672  # processed images are stored with this long side (multiple of 14)
  store_format: png
  num_prepare_workers: 8
  vindr:
    label_scheme: birads_4plus   # birads_4plus: 1-3 -> 0, 4-5 -> 1 | birads_3plus: 1-2 -> 0, 3-5 -> 1 (the grouping Petrini et al. use).
                                 # A BI-RADS *suspicion* label, not pathology.
    val_fraction: 0.15           # carved out of the official training split, grouped by study_id
    crop_breast: true
  us_sources: [busi]             # ultrasound sources merged into one pool; others need raw/<key>/ (see `mmibc inspect`)
  us_external_source: null       # a source held out entirely as the external test set (e.g. breast_lesions_usg)
  busi:
    label_scheme: binary_no_normal   # binary_no_normal | binary_normal_as_benign | three_class
    dedupe: true
    dup_hamming: 6                   # max dHash Hamming distance (of 256 bits) to call near-duplicates
    max_color_overlay: 0.02          # fraction of coloured pixels above which an image is flagged
    inpaint_overlay: true
    val_fraction: 0.15
    test_fraction: 0.15

task:
  kind: multiview            # multiview | synthetic_pairs
  pair_mode: label_matched   # synthetic_pairs only: label_matched | random | shuffled_partner
  resample_each_epoch: true  # synthetic_pairs: re-draw partners every training epoch
  eval_pair_seed: 1234       # seed of the FROZEN val/test pairs

input:
  image_size: 224       # model-input canvas: an int (square) or [height, width]; multiples of the patch size (14; 16 for DINOv3; 32 for CNNs)
  image_size_a: null    # optional per-stream override (stream a = mammogram). The breast is tall and narrow: e.g. [448, 280] keeps ~3x more lesion pixels than 224x224
  image_size_b: null    # stream b = ultrasound (or the second mammography view, which always follows stream a)
  clahe: false
  augment:
    affine_degrees: 8
    translate: 0.04
    scale: [0.95, 1.05]
    brightness: 0.1
    contrast: 0.1
    hflip: false

model:
  backbone: dinov2_base          # dinov2_small | dinov2_base | dinov2_large | dinov2_tiny_test
  pretrained: true
  shared_backbone: false         # true for CC/MLO views of the same modality
  fusion: xattn                  # unimodal_a | unimodal_b | early | concat | gated | xattn | xattn_gated
  n_classes: 2
  xattn_layers: 1
  xattn_heads: 8
  head_hidden: 512
  dropout: 0.3
  freeze: last_n                 # all | last_n | none  (what happens to the BACKBONES)
  unfreeze_last_n: 2
  drop_path: 0.0                 # stochastic depth on the trainable ViT blocks (0 = off; 0.1 is a common fine-tuning value)

training:
  epochs: 30
  batch_size: 32
  num_workers: 4
  amp: auto                      # auto | fp16 | bf16 | off
  grad_accum_steps: 1
  grad_clip: 1.0
  lr_head: 1.0e-3
  lr_backbone: 1.0e-5
  layer_decay: 1.0               # layer-wise lr decay over the trainable ViT blocks (1.0 = off; 0.75 with unfreeze_last_n >= 4)
  label_smoothing: 0.0           # 0 = off; 0.05-0.1 curbs over-confidence (ce / weighted_ce)
  ema_decay: 0.0                 # EMA of the trainable weights, used for validation / best.pt / evaluation (0 = off; 0.998 ~ the last 500 steps)
  weight_decay: 0.05
  modality_dropout: 0.0          # probability of blanking one stream per training sample (robustness / reliance control)
  scheduler: cosine              # cosine | plateau | none
  warmup_epochs: 1
  loss: ce                       # ce | weighted_ce | focal
  focal_gamma: 2.0
  sampler: balanced              # balanced | none   (train only; val/test are never resampled)
  monitor: val_auroc
  monitor_mode: max
  patience: 8
  min_delta: 0.0005
  save_trainable_only: true
  resume: true

eval:
  bootstrap_samples: 1000
  calibration: platt             # none | temperature | platt: fitted on VALIDATION logits, applied to every split. Does not change AUROC.
  threshold_method: sens_target  # chosen on VALIDATION only: youden | sens_target | spec_target | f1 | fixed_0.5
  sens_target: 0.90
  spec_target: 0.90
  operating_points: true         # also report sens@90/95 and spec@90/95 (thresholds from validation) for every split
  controls: [none, drop_a, drop_b, shuffle_b]

xai:
  n_samples: 100
  cam_threshold: 0.5
  steps: 20

audit:                           # merge-integrity audit; error findings stop the pipeline (see data/merge_audit.py)
  min_per_class_split: 20
  max_prevalence_gap: 0.25
  max_meta_auc: 0.70
  dup_hamming: 6
  check_files: all               # all | exists | sample:<N>
  stop_on_error: true

figures:
  formats: [pdf, png]            # vector PDF for the manuscript, 600-dpi PNG for slides
  png_dpi: 600
  width: single                  # single | double | full (column widths of the target template)
  template: lncs                 # lncs | ieee | elsevier | generic  (sets column widths in mm)
